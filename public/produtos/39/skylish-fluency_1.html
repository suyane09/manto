<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skylish Fluency</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0C0920;
    --bg-2: #120C2B;
    --card: #1B1440;
    --card-2: #221A52;
    --card-line: rgba(255,255,255,0.08);
    --purple: #8B5CF6;
    --purple-2: #A78BFA;
    --pink: #D6479B;
    --glow: rgba(139,92,246,0.35);
    --gold: #F5B729;
    --gold-2: #FFD166;
    --text: #F4F2FB;
    --text-soft: #B3ABD6;
    --text-faint: #7B72A3;
    --green: #2FAE7A;
    --blue: #3B7DE0;
    --amber: #E08A3E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--gold); color:#1a1330;}
  img{max-width:100%; display:block;}

  .wrap{max-width:1240px; margin:0 auto; padding:0 40px;}

  /* ---------------- NAVBAR ---------------- */
  .navbar{
    position:sticky; top:0; z-index:40;
    background:rgba(12,9,32,0.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--card-line);
  }
  .nav-inner{
    max-width:1240px; margin:0 auto; padding:16px 40px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo-row{display:flex; align-items:center; gap:11px; cursor:pointer;}
  .logo-badge{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, #C79CFF, #8B5CF6 55%, #5B2FD1 100%);
    box-shadow:0 0 22px var(--glow);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .logo-badge svg{width:22px; height:22px;}
  .logo-img{
    width:50px; height:50px; border-radius:50%; flex-shrink:0; object-fit:cover;
    filter:drop-shadow(0 0 14px var(--glow));
  }
  .logo-text{line-height:1.05;}
  .logo-text .l1{font-family:'Fraunces',serif; font-weight:600; font-size:17px;}
  .logo-text .l2{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.16em; color:var(--text-faint);}

  .nav-links{display:flex; align-items:center; gap:28px;}
  .nav-links a{font-size:13.5px; color:var(--text-soft); text-decoration:none; font-weight:500;}
  .nav-links a:hover{color:var(--text);}
  .nav-actions{display:flex; align-items:center; gap:16px;}
  .link-btn{background:none; border:none; color:var(--text-soft); font-size:13.5px; font-weight:600;}
  .link-btn:hover{color:var(--text);}
  .btn-gold{
    background:linear-gradient(135deg, var(--gold-2), var(--gold));
    color:#241705; border:none; font-weight:700; font-size:13.5px;
    padding:10px 20px; border-radius:9px; display:inline-flex; align-items:center; gap:6px;
    box-shadow:0 6px 20px rgba(245,183,41,0.25);
  }
  .btn-gold:hover{filter:brightness(1.05);}
  @media (max-width: 980px){ .nav-links{display:none;} }

  /* ---------------- HERO ---------------- */
  .hero{
    position:relative; overflow:hidden;
    background:
      radial-gradient(700px 500px at 78% 20%, rgba(139,92,246,0.20), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    padding:76px 0 60px;
  }
  .hero-grid{display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600;
    color:var(--gold-2); background:rgba(245,183,41,0.10); border:1px solid rgba(245,183,41,0.25);
    padding:6px 13px; border-radius:20px; margin-bottom:20px;
  }
  .hero h1{font-size:48px; line-height:1.1; font-weight:600; margin:0 0 20px;}
  .hero h1 .accent{color:var(--gold-2);}
  .hero p.lead{font-size:16px; color:var(--text-soft); line-height:1.65; max-width:460px; margin:0 0 30px;}
  .hero-ctas{display:flex; gap:14px; margin-bottom:44px;}
  .btn-ghost{
    background:transparent; border:1.5px solid var(--card-line); color:var(--text);
    padding:12px 22px; border-radius:9px; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-ghost:hover{border-color:var(--purple-2);}
  .btn-gold.big{padding:13px 24px; font-size:14.5px;}

  .feature-row{display:flex; flex-wrap:wrap; gap:26px;}
  .feature-item{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-soft); max-width:150px;}
  .feature-icon{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    background:var(--card); border:1px solid var(--card-line);
    display:flex; align-items:center; justify-content:center;
  }

  .hero-art{
    position:relative; height:460px; display:flex; align-items:center; justify-content:center;
  }
  .orbit-ring{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:360px; height:360px; border-radius:50%; z-index:1;
    border:1.5px solid rgba(167,139,250,0.4);
    box-shadow:0 0 70px 12px var(--glow), inset 0 0 70px 12px rgba(139,92,246,0.14);
  }
  .mascot-img{
    position:relative; z-index:2; height:440px; width:auto; max-width:100%;
    object-fit:contain; filter:drop-shadow(0 24px 40px rgba(0,0,0,0.5));
  }
  .orbit-core svg{width:92px; height:92px; opacity:0.9;}
  .float-chip{
    position:absolute; background:var(--card); border:1px solid var(--card-line);
    border-radius:12px; padding:9px 13px; font-size:12px; font-weight:600; color:var(--text);
    display:flex; align-items:center; gap:7px; box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .chip1{top:14px; left:0;} .chip2{top:60px; right:0;} .chip3{bottom:30px; left:6px;} .chip4{bottom:0; right:24px;}

  /* ---------------- SECTION HEADERS ---------------- */
  .section{padding:80px 0;}
  .section.alt{background:var(--bg-2);}
  .section-head{text-align:center; max-width:560px; margin:0 auto 44px;}
  .section-head h2{font-size:30px; font-weight:600; margin:0 0 10px;}
  .section-head p{color:var(--text-soft); font-size:14.5px; margin:0;}

  /* ---------------- LEVEL CARDS ---------------- */
  .level-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:14px;}
  .lvl-card{
    background:var(--card); border:1px solid var(--card-line); border-radius:14px;
    padding:18px 16px 20px; position:relative; overflow:hidden; cursor:pointer;
    transition:transform .15s, border-color .15s;
  }
  .lvl-card:hover{transform:translateY(-3px); border-color:var(--accent);}
  .lvl-card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--accent);
  }
  .lvl-code-badge{
    width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; color:#fff;
    background:var(--accent); margin-bottom:14px;
  }
  .lvl-tag{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); margin-bottom:4px;}
  .lvl-name{font-size:14.5px; font-weight:700; margin-bottom:8px;}
  .lvl-desc{font-size:12px; color:var(--text-soft); line-height:1.5;}
  @media (max-width: 980px){ .level-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width: 620px){ .level-grid{grid-template-columns:repeat(2,1fr);} }
  .center-btn{text-align:center; margin-top:32px;}

  /* ---------------- METHOD ---------------- */
  .method-grid{display:grid; grid-template-columns:2fr 1fr; gap:26px; align-items:stretch;}
  .method-steps{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; background:var(--card); border:1px solid var(--card-line); border-radius:18px; padding:34px 30px;}
  .step{flex:1; text-align:center; position:relative;}
  .step-icon{
    width:58px; height:58px; border-radius:50%; margin:0 auto 14px; position:relative;
    background:var(--card-2); border:1.5px solid var(--purple-2);
    display:flex; align-items:center; justify-content:center;
  }
  .step-icon svg{width:24px; height:24px; color:var(--purple-2);}
  .step-num{
    position:absolute; top:-4px; right:-2px; width:20px; height:20px; border-radius:50%;
    background:var(--gold); color:#241705; font-size:10.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .step h3{font-size:14.5px; margin:0 0 6px; font-weight:700;}
  .step p{font-size:12.5px; color:var(--text-soft); margin:0; line-height:1.5;}
  .step-arrow{align-self:center; color:var(--text-faint); font-size:18px; padding-top:20px;}
  @media (max-width: 900px){ .method-grid{grid-template-columns:1fr;} .method-steps{flex-direction:column; gap:24px;} .step-arrow{display:none;} }

  .challenge-card{
    background:linear-gradient(160deg, #3A2280, #2A1760); border:1px solid rgba(167,139,250,0.35);
    border-radius:18px; padding:26px; display:flex; flex-direction:column;
  }
  .challenge-tag{
    display:inline-flex; align-self:flex-start; font-size:11px; font-weight:700; color:var(--gold-2);
    background:rgba(245,183,41,0.14); padding:5px 11px; border-radius:20px; margin-bottom:16px;
  }
  .challenge-card h3{font-size:16px; margin:0 0 8px; font-weight:700;}
  .challenge-card p{font-size:12.5px; color:var(--text-soft); line-height:1.55; margin:0 0 20px;}
  .challenge-mic{
    width:52px; height:52px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center;
    margin-bottom:16px; box-shadow:0 0 30px rgba(245,183,41,0.35);
  }
  .challenge-mic svg{width:22px; height:22px; color:#241705;}
  .xp-row{font-size:11px; color:var(--text-soft); margin-bottom:16px;}
  .xp-row b{color:var(--gold-2); font-family:'IBM Plex Mono',monospace;}
  .challenge-card .btn-gold{margin-top:auto; justify-content:center;}

  /* ---------------- DASHBOARD PREVIEW (static mockup) ---------------- */
  .preview-shell{
    background:var(--card); border:1px solid var(--card-line); border-radius:20px; overflow:hidden;
    display:grid; grid-template-columns:190px 1fr; box-shadow:0 30px 70px rgba(0,0,0,0.4);
  }
  .preview-side{background:var(--bg-2); padding:22px 16px; border-right:1px solid var(--card-line);}
  .preview-side .logo-row{margin-bottom:22px; transform:scale(0.85); transform-origin:left;}
  .p-nav-item{
    display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; font-size:11.5px;
    color:var(--text-faint); margin-bottom:2px;
  }
  .p-nav-item.active{background:var(--card-2); color:var(--text);}
  .preview-main{padding:26px 28px;}
  .preview-hello{font-size:16px; font-weight:700; margin:0 0 4px;}
  .preview-sub{font-size:12px; color:var(--text-soft); margin:0 0 20px;}
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
  .stat-card{background:var(--card-2); border:1px solid var(--card-line); border-radius:12px; padding:14px 16px;}
  .stat-label{font-size:10.5px; color:var(--text-faint); margin-bottom:8px;}
  .stat-value{font-size:22px; font-weight:700; font-family:'Fraunces',serif;}
  .stat-sub{font-size:10.5px; color:var(--text-faint); margin-top:4px;}
  .continue-card{background:var(--card-2); border:1px solid var(--card-line); border-radius:12px; padding:16px;}
  .continue-label{font-size:11px; color:var(--text-faint); margin-bottom:10px; font-weight:600;}
  .continue-row{display:flex; gap:14px; align-items:center;}
  .continue-thumb{width:64px; height:44px; border-radius:8px; background:linear-gradient(135deg, var(--purple), var(--pink)); flex-shrink:0;}
  .continue-info{flex:1;}
  .continue-title{font-size:13px; font-weight:700; margin-bottom:2px;}
  .continue-meta{font-size:10.5px; color:var(--text-faint); margin-bottom:8px;}
  .bar-track{height:6px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--purple), var(--pink)); border-radius:4px;}
  @media (max-width: 900px){ .preview-shell{grid-template-columns:1fr;} .preview-side{display:none;} }

  /* ---------------- TESTIMONIALS ---------------- */
  .test-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .test-card{background:var(--card); border:1px solid var(--card-line); border-radius:16px; padding:22px;}
  .test-top{display:flex; align-items:center; gap:11px; margin-bottom:14px;}
  .test-avatar{
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:#fff;
  }
  .test-name{font-size:13.5px; font-weight:700;}
  .test-level{font-size:11px; color:var(--text-faint);}
  .test-quote{font-size:13px; color:var(--text-soft); line-height:1.6; margin:0 0 14px;}
  .stars{color:var(--gold); font-size:13px; letter-spacing:2px;}
  @media (max-width: 900px){ .test-grid{grid-template-columns:1fr;} }

  /* ---------------- CTA BANNER ---------------- */
  .cta-banner-wrap{position:relative;}
  .cta-banner{
    background:linear-gradient(120deg, #4B2AA8, #7C3AED 55%, #B14FA8);
    border-radius:22px; padding:44px 46px; display:flex; align-items:center; justify-content:space-between;
    gap:30px; margin:0 auto; max-width:1240px; position:relative; z-index:1;
  }
  .cta-mascot{
    position:absolute; bottom:0; left:60px; height:210px; width:auto; z-index:2;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,0.45));
  }
  @media (max-width: 700px){ .cta-mascot{display:none;} }
  .cta-banner h2{font-size:23px; margin:0 0 4px; font-weight:600;}
  .cta-banner p{margin:0; color:rgba(244,242,251,0.85); font-size:13.5px;}
  .cta-form{display:flex; gap:10px; flex-shrink:0;}
  .cta-form input{
    padding:12px 16px; border-radius:9px; border:none; width:230px; font-size:13.5px; outline:none;
  }
  @media (max-width: 860px){ .cta-banner{flex-direction:column; align-items:flex-start;} .cta-form{width:100%;} .cta-form input{flex:1; width:auto;} }

  /* ---------------- FOOTER ---------------- */
  .footer{padding:60px 0 30px; border-top:1px solid var(--card-line);}
  .footer-grid{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:30px; margin-bottom:40px;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin:0 0 14px;}
  .footer-col a{display:block; font-size:13px; color:var(--text-soft); text-decoration:none; margin-bottom:10px;}
  .footer-col a:hover{color:var(--text);}
  .footer-brand p{font-size:13px; color:var(--text-soft); margin:14px 0 0; max-width:220px; line-height:1.6;}
  .social-row{display:flex; gap:10px; margin-top:14px;}
  .social-icon{
    width:32px; height:32px; border-radius:50%; background:var(--card); border:1px solid var(--card-line);
    display:flex; align-items:center; justify-content:center; color:var(--text-soft);
  }
  .footer-bottom{text-align:center; font-size:12px; color:var(--text-faint); padding-top:24px; border-top:1px solid var(--card-line);}
  @media (max-width: 860px){ .footer-grid{grid-template-columns:1fr 1fr;} }

  /* =========================================================
     APP (login / signup / dashboard / lesson) � purple theme
     ========================================================= */
  .app-wrap{min-height:100vh; display:flex;}
  .auth-left{
    flex:1.1; color:var(--text); padding:56px 60px; display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
    background:
      radial-gradient(900px 500px at -10% -10%, rgba(214,71,155,0.18), transparent 60%),
      radial-gradient(700px 500px at 90% 100%, rgba(139,92,246,0.22), transparent 60%),
      linear-gradient(160deg, var(--bg-2), var(--bg) 85%);
  }
  .auth-hero h1{font-size:38px; line-height:1.15; font-weight:600; margin:26px 0 16px; max-width:440px;}
  .auth-hero p{color:var(--text-soft); font-size:15px; line-height:1.6; max-width:400px; margin:0;}
  .ladder{display:flex; flex-direction:column; margin-top:36px;}
  .rung{display:flex; align-items:center; gap:14px; padding:9px 0; position:relative;}
  .rung::before{content:''; position:absolute; left:15px; top:-9px; bottom:calc(50% + 1px); width:1px; background:rgba(244,242,251,0.14);}
  .rung:first-child::before{display:none;}
  .rung-badge{
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; border:1px solid rgba(244,242,251,0.2); flex-shrink:0;
  }
  .rung-label{font-size:13px; color:var(--text-soft);}
  .rung-label b{color:var(--text); font-weight:600;}
  .auth-foot{font-size:12px; color:var(--text-faint);}

  .auth-right{flex:1; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:40px;}
  .auth-card{width:100%; max-width:360px;}
  .auth-card h2{font-size:25px; margin:0 0 6px; font-weight:600;}
  .auth-sub{color:var(--text-soft); font-size:13.5px; margin:0 0 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:7px;}
  .field input{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--card-line); background:var(--card);
    font-size:14px; color:var(--text); outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--purple-2);}
  .btn-primary{
    width:100%; padding:13px; border-radius:9px; border:none;
    background:linear-gradient(135deg, var(--gold-2), var(--gold)); color:#241705; font-weight:700; font-size:14px; margin-top:6px;
  }
  .btn-primary:hover{filter:brightness(1.04);}
  .auth-switch{text-align:center; margin-top:20px; font-size:13px; color:var(--text-soft);}
  .auth-switch a{color:var(--purple-2); font-weight:700; cursor:pointer; text-decoration:none;}
  .auth-error{background:rgba(214,71,155,0.14); color:#F3A6CE; font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px;}
  .auth-hint{font-size:11.5px; color:var(--text-faint); margin-top:18px; line-height:1.5; padding-top:16px; border-top:1px solid var(--card-line);}
  .back-home{background:none; border:none; color:var(--text-faint); font-size:12.5px; font-weight:600; margin-bottom:24px; display:inline-flex; align-items:center; gap:6px;}
  .back-home:hover{color:var(--text-soft);}

  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:270px; flex-shrink:0; background:var(--bg-2); color:var(--text); padding:26px 22px;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
    border-right:1px solid var(--card-line);
  }
  .sidebar .logo-row{margin-bottom:30px;}
  .side-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin:0 0 14px; font-weight:600;}
  .level-list{display:flex; flex-direction:column;}
  .level-item{display:flex; align-items:center; gap:12px; padding:11px 10px; border-radius:9px; cursor:pointer; position:relative; border:1px solid transparent;}
  .level-item::before{content:''; position:absolute; left:24px; top:-1px; bottom:calc(50% + 15px); width:1px; background:rgba(244,242,251,0.1);}
  .level-item:first-child::before{display:none;}
  .level-item:hover{background:rgba(244,242,251,0.04);}
  .level-item.active{background:var(--card); border-color:rgba(167,139,250,0.4);}
  .level-badge{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; border:1.5px solid rgba(244,242,251,0.2); background:var(--card);
  }
  .level-badge.done{background:var(--gold); border-color:var(--gold); color:#241705; font-weight:800;}
  .level-badge.partial{border-color:var(--purple-2); color:var(--purple-2);}
  .level-info{flex:1; min-width:0;}
  .level-name{font-size:13px; font-weight:600;}
  .level-progress-txt{font-size:10.5px; color:var(--text-faint); margin-top:2px;}
  .sidebar-bottom{margin-top:auto; padding-top:20px; border-top:1px solid var(--card-line);}
  .user-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .avatar{width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg, var(--purple-2), var(--pink)); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:13px; font-family:'Fraunces',serif;}
  .user-name{font-size:13px; font-weight:600;}
  .user-overall{font-size:10.5px; color:var(--text-faint);}
  .logout-btn{width:100%; padding:9px; border-radius:8px; background:transparent; border:1px solid var(--card-line); color:var(--text-soft); font-size:12px;}
  .logout-btn:hover{border-color:var(--purple-2); color:var(--text);}

  .main{flex:1; min-width:0; padding:40px 48px; max-width:920px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .level-title{font-size:29px; font-weight:600; margin:0;}
  .level-code-pill{font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:4px 10px; border-radius:20px; background:var(--card); color:var(--purple-2); font-weight:600; border:1px solid var(--card-line);}
  .level-desc{color:var(--text-soft); font-size:14px; margin:6px 0 30px;}

  .lesson-list{display:flex; flex-direction:column; gap:10px;}
  .lesson-card{display:flex; align-items:center; gap:16px; padding:16px 18px; background:var(--card); border:1px solid var(--card-line); border-radius:12px; cursor:pointer; transition:border-color .15s, transform .1s;}
  .lesson-card:hover{border-color:var(--purple-2); transform:translateY(-1px);}
  .lesson-num{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-faint); width:34px; flex-shrink:0;}
  .lesson-check{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--card-line); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lesson-check.done{background:var(--green); border-color:var(--green);}
  .lesson-main{flex:1; min-width:0;}
  .lesson-title{font-size:15px; font-weight:600; margin:0 0 2px;}
  .lesson-desc{font-size:12.5px; color:var(--text-faint); margin:0;}
  .lesson-duration{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-faint); flex-shrink:0;}

  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-soft); margin-bottom:20px; background:none; border:none; padding:0; font-weight:600;}
  .back-link:hover{color:var(--text);}
  .video-box{width:100%; aspect-ratio:16/9; background:var(--bg-2); border:1px solid var(--card-line); border-radius:14px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; margin-bottom:26px;}
  .video-box iframe{width:100%; height:100%; border:none;}
  .video-placeholder{display:flex; flex-direction:column; align-items:center; gap:14px; color:var(--text-faint);}
  .play-circle{width:56px; height:56px; border-radius:50%; border:1.5px solid rgba(167,139,250,0.4); display:flex; align-items:center; justify-content:center; color:var(--purple-2);}
  .lesson-header{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:10px;}
  .lesson-h-title{font-size:25px; font-weight:600; margin:0;}
  .lesson-h-meta{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-faint); margin-top:6px;}
  .mark-btn{flex-shrink:0; padding:11px 18px; border-radius:9px; border:1.5px solid var(--green); background:transparent; color:var(--green); font-weight:700; font-size:13px; display:flex; align-items:center; gap:7px; white-space:nowrap;}
  .mark-btn.done{background:var(--green); color:#fff;}
  .lesson-body-desc{font-size:14.5px; line-height:1.7; color:var(--text-soft); max-width:640px; margin:18px 0 30px;}
  .video-edit{display:flex; gap:8px; align-items:center; margin-bottom:26px; margin-top:-16px;}
  .video-edit input{flex:1; padding:9px 12px; border-radius:8px; border:1px solid var(--card-line); background:var(--card); color:var(--text); font-size:12px; font-family:'IBM Plex Mono',monospace;}
  .video-edit button{padding:9px 14px; border-radius:8px; border:1px solid var(--purple); background:var(--purple); color:#fff; font-size:12px; font-weight:700;}
  .lesson-nav{display:flex; justify-content:space-between; margin-top:10px; padding-top:24px; border-top:1px solid var(--card-line);}
  .nav-btn{padding:11px 16px; border-radius:9px; border:1px solid var(--card-line); background:var(--card); font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:8px;}
  .nav-btn:hover{border-color:var(--purple-2);}
  .nav-btn:disabled{opacity:0.35; cursor:default;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--card-line); color:var(--text); padding:11px 20px; border-radius:9px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  @media (max-width: 860px){
    .auth-left{display:none;}
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; align-items:center; padding:16px;}
    .sidebar .logo-row{margin-bottom:0; margin-right:16px;}
    .side-section-label{display:none;}
    .level-list{flex-direction:row; gap:8px;}
    .level-item::before{display:none;}
    .level-info{display:none;}
    .sidebar-bottom{display:none;}
    .main{padding:24px 20px;}
    .hero-grid{grid-template-columns:1fr;}
    .hero-art{height:280px;}
  }
</style>
</head>

const USERS_KEY = 'skylish_users';
const VIDEOS_KEY = 'skylish_videos';
const progressKey = (u) => 'skylish_progress_' + u;
const LAST_USER_KEY = 'skylish_last_user';

  screen: 'landing', // landing | login | signup | dashboard | lesson

function totalLessons(){ return LEVELS.reduce((s,l)=>s+l.lessons.length,0); }
function levelDoneCount(level){ return level.lessons.filter(ls=>state.progress[ls.id]).length; }
function overallDoneCount(){ return LEVELS.reduce((s,l)=>s+levelDoneCount(l),0); }

function youTubeEmbed(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    let id = '';
    if(u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
    else if(u.searchParams.get('v')) id = u.searchParams.get('v');
    else if(u.pathname.includes('/embed/')) id = u.pathname.split('/embed/')[1];
    if(!id) return null;
    return 'https://www.youtube.com/embed/' + id;
  }catch(e){ return null; }
}

async function loadInitial(){
  try{ const u = await window.storage.get(USERS_KEY, true); state.users = u ? JSON.parse(u.value) : {}; }catch(e){ state.users = {}; }
  try{ const v = await window.storage.get(VIDEOS_KEY, true); state.videos = v ? JSON.parse(v.value) : {}; }catch(e){ state.videos = {}; }
  try{ const lu = await window.storage.get(LAST_USER_KEY, false); if(lu && lu.value) state.lastUser = lu.value; }catch(e){}
  state.loading = false;
  render();
}
async function loadProgress(username){
  try{ const p = await window.storage.get(progressKey(username), true); state.progress = p ? JSON.parse(p.value) : {}; }catch(e){ state.progress = {}; }
}
async function saveUsers(){ await window.storage.set(USERS_KEY, JSON.stringify(state.users), true); }
async function saveProgress(){ await window.storage.set(progressKey(state.user), JSON.stringify(state.progress), true); }
async function saveVideos(){ await window.storage.set(VIDEOS_KEY, JSON.stringify(state.videos), true); }

function showToast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800);
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k === 'disabled'){ if(attrs[k]) e.setAttribute('disabled','true'); }
    else if(attrs[k] === false || attrs[k] === null || attrs[k] === undefined){ /* skip */ }
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c!==null && c!==undefined) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function svg(html, viewBox){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox', viewBox || '0 0 24 24'); s.innerHTML = html; return s;
}

async function doLogin(){
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if(!user || !pass){ state.error='Preencha usu�rio e senha.'; renderAuth(); return; }
  if(!state.users[user] || state.users[user] !== pass){ state.error='Usu�rio ou senha incorretos.'; renderAuth(); return; }
  state.user = user; state.error = '';
  try{ await window.storage.set(LAST_USER_KEY, user, false); }catch(e){}
  await loadProgress(user);
  state.screen = 'dashboard'; state.selectedLevelIdx = 0;
  render();
}
async function doSignup(){
  const user = document.getElementById('signup-user').value.trim();
  const pass = document.getElementById('signup-pass').value;
  if(!user || !pass){ state.error='Preencha usu�rio e senha.'; renderAuth(); return; }
  if(state.users[user]){ state.error='Esse usu�rio j� existe. Tente outro.'; renderAuth(); return; }
  state.users[user] = pass;
  try{ await saveUsers(); }catch(e){ state.error='Erro ao salvar. Tente novamente.'; renderAuth(); return; }
  state.user = user; state.error = '';
  try{ await window.storage.set(LAST_USER_KEY, user, false); }catch(e){}
  state.progress = {}; state.screen = 'dashboard'; state.selectedLevelIdx = 0;
  render();
}

      el('h1',{class:'lesson-h-title'},[ctx.lesson.title]),
      el('div',{class:'lesson-h-meta'},[ctx.level.code+' � Aula '+String(ctx.lessonIdx+1).padStart(2,'0')+' � '+ctx.lesson.duration])
    ]),
    el('button',{class:'mark-btn'+(done?' done':''), onclick: async ()=>{
      state.progress[ctx.lesson.id] = !done;
      try{ await saveProgress(); }catch(e){ showToast('Erro ao salvar progresso'); }
      render();
      showToast(state.progress[ctx.lesson.id] ? 'Aula marcada como conclu�da' : 'Aula desmarcada');
    }},[done?'? Conclu�da':'Marcar como conclu�da'])
  ]));
  main.appendChild(el('p',{class:'lesson-body-desc'},[ctx.lesson.desc+' Assista ao v�deo acima, pratique com aten��o e marque a aula como conclu�da ao finalizar.']));
  const flat = []; LEVELS.forEach(l=>l.lessons.forEach(ls=>flat.push(ls)));
  const fi = flat.findIndex(l=>l.id===ctx.lesson.id);
  const prev = flat[fi-1], next = flat[fi+1];
  main.appendChild(el('div',{class:'lesson-nav'},[
    el('button',{class:'nav-btn', disabled: !prev, onclick:()=>{ if(prev){ state.selectedLessonId=prev.id; render(); } }},['? Aula anterior']),
    el('button',{class:'nav-btn', disabled: !next, onclick:()=>{ if(next){ state.selectedLessonId=next.id; render(); } }},['Pr�xima aula ?'])
  ]));
  return main;
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  if(state.loading){
    document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-family:Inter,sans-serif;background:var(--bg);">Carregando�</div>';
    return;
  }
  if(state.screen === 'landing'){ renderLanding(); return; }
  if(state.screen === 'login' || state.screen === 'signup'){ renderAuth(); return; }
  renderApp();
}

document.getElementById('app').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#7B72A3;font-family:Inter,sans-serif;background:#0C0920;">Carregando�</div>';
loadInitial();
</script>
